# =============================================================================
# Capa 6 — Mantenimiento: ejecución semanal programada del radar
#
# Propósito: ejecutar src/main.py (modo normal: descarga datos nuevos de
#   Yahoo Finance) cada lunes a las 02:00 UTC (≈ domingo 23:00 en Chile en
#   horario de verano; 22:00 en invierno), para que el reporte esté listo antes
#   de la reunión del comité del lunes a las 08:00. También se puede lanzar a
#   mano desde la pestaña Actions (workflow_dispatch).
#   Al terminar, guarda en el repositorio el reporte, el log y los datos
#   actualizados. Si main.py falla, el log de la falla igual se guarda y el
#   workflow queda en rojo.
# Entradas: requirements.txt, src/, data/processed/cv_bsadf.json (caché de
#   valores críticos), Yahoo Finance.
# Salidas: commit con outputs/reporte_radar_AAAA-MM-DD.xlsx, logs/ y data/.
#   La corrida queda en el log con origen "programada" (cron) o "manual"
#   (workflow_dispatch), que alimenta los KPIs IL4.
# =============================================================================

name: Radar semanal

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-semanal
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORIGEN: ${{ github.event_name == 'schedule' && 'programada' || 'manual' }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar el radar
        id: radar
        run: python src/main.py --origen "$ORIGEN"

      # Corre también si el radar falló (para guardar el log de la falla); el
      # workflow igual queda en rojo porque el paso anterior falló.
      - name: Guardar reporte, log y datos en el repositorio
        if: always() && (steps.radar.outcome == 'success' || steps.radar.outcome == 'failure')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/*.xlsx logs/ data/
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Radar semanal: ejecución ${ORIGEN} del $(date -u +%Y-%m-%d) (${{ steps.radar.outcome }})"
          git pull --rebase
          git push
